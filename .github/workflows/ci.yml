name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # The idle brake (docs/idle-training.md): the daemon's decision table, pid file and
      # train-when-idle.sh, and the standalone Python reader. No Rust, no GPU.
      - name: Brake scripts
        run: |
          bash -n scripts/auto-brake.sh
          bash -n scripts/train-when-idle.sh
          bash scripts/test-auto-brake.sh
          python3 -I scripts/test_brake.py

  # Everything except sky-train, which links mlx-rs and needs macOS + Metal.
  # The golden tests of sky-infer need the pinned oscar-1-17m model in models-src/oscar
  # (gitignored): a missing model fails them, so it is fetched (hash-checked) and cached here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache the golden model
        uses: actions/cache@v4
        with:
          path: models-src/oscar
          key: oscar-1-17m-a443c18107534cb3148941de601e15a89a2c6da3
      - name: Fetch the golden model
        run: |
          test -f models-src/oscar/model.safetensors || cargo run --release -p sky-data -- \
            --cache "$RUNNER_TEMP/hf" fetch-model mgoeckel/oscar-1-17m \
            --rev a443c18107534cb3148941de601e15a89a2c6da3 --out models-src/oscar
      - name: Clippy
        run: cargo clippy --workspace --exclude sky-train --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude sky-train --release

  # sky-train builds against MLX/Metal. Hosted macOS runners are virtual machines without Metal
  # GPU access, so the crate is compiled and linted here, and its tests are allowed to fail;
  # run them locally on Apple Silicon (see tutorial chapter 02).
  sky-train:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p sky-train --all-targets -- -D warnings
      - name: Tests (best effort without a GPU)
        continue-on-error: true
        run: cargo test -p sky-train --release

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/sky-web-wasm"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # wasm-pack test runs the node on PATH: pin one that runs relaxed SIMD (Node 21 and later,
      # webassembly.org/features); 24 is the version the bench numbers were measured with.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build the browser module (SIMD128 and relaxed SIMD)
        run: scripts/build-wasm.sh
      - name: Parity of the served target, the iso guarantees and the secrets verifier (wasm32 under Node)
        run: RUSTFLAGS="-C target-feature=+simd128" wasm-pack test --node --release crates/sky-web --test parity --test iso --test forecast --test verify
      - name: The same with relaxed SIMD (the module the loader prefers)
        run: RUSTFLAGS="-C target-feature=+simd128,+relaxed-simd" wasm-pack test --node --release crates/sky-web --test parity --test iso --test forecast --test verify
      - name: The glue-free Node host of the secrets verifier answers as the glue and the native engine
        run: node crates/sky-web/bench/verify-node.mjs --glue
      - name: Check the output
        run: >-
          test -s site/public/pkg/sky_web_bg.wasm && test -s site/public/pkg/sky_web_relaxed_bg.wasm &&
          test -s site/public/pkg/sky_web.js

  # The site's tests (the Models catalogue against the manifest, the demos' pure parts) and its
  # build, which fails on a dead link. Neither needs the wasm modules.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # the tests are TypeScript run by node --test, which needs Node 22.18 or later
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site ci
      - name: Tests
        run: npm --prefix site test
      - name: Build (dead links fail it)
        run: npm --prefix site run docs:build

  # The scripts: syntax and shellcheck on every shell script, and the Python test files of
  # scripts/ that need only the standard library. Left out because they import numpy:
  # scripts/route/test_baselines.py, test_cast2_data.py, test_route_embed.py and
  # test_turn_teacher.py; test_brake.py runs in the fmt job.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f" || exit 1; done
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: Python tests (standard library only)
        run: |
          set -e
          for t in \
            scripts/secrets2/test_candidates.py scripts/secrets2/test_runners.py \
            scripts/secrets2/test_scorer.py scripts/secrets2/test_union.py \
            scripts/test_all_report.py scripts/test_build_route6_data.py \
            scripts/test_hf_collection.py scripts/test_hf_publish.py scripts/test_hf_publish_data.py \
            scripts/test_route7_gate.py scripts/test_route_t5.py scripts/test_s6_adopt.py \
            scripts/test_s6_cast2_gate.py scripts/test_s6_route3_gate.py \
            scripts/test_s6_route4_checks.py scripts/test_s6_route4_pilot.py \
            scripts/test_s6_route5_checks.py scripts/test_s6_route5_pilot.py \
            scripts/test_s6_route6_blind.py scripts/test_s6_route6_checks.py \
            scripts/test_s6_route6_fit.py scripts/test_s6_route6_gate.py \
            scripts/test_s6_route6_pilot.py scripts/test_s6_route7_reference.py \
            scripts/test_s6_route_gate.py scripts/test_s6_secrets2_gate.py \
            scripts/test_s6_secrets3_gate.py scripts/test_s6_sleep3_report.py \
            scripts/test_s6_sleep4_report.py scripts/test_s6_sleep_report.py \
            scripts/test_turn3_scripts.py scripts/test_turn_gate.py; do
            echo "== $t"
            python3 -I "$t"
          done
