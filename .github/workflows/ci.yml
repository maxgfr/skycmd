name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Everything except sky-train, which links mlx-rs and needs macOS + Metal.
  # The golden tests of sky-infer need the pinned oscar-1-17m model in models-src/oscar
  # (gitignored): a missing model fails them, so it is fetched (hash-checked) and cached here.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache the golden model
        uses: actions/cache@v4
        with:
          path: models-src/oscar
          key: oscar-1-17m-a443c18107534cb3148941de601e15a89a2c6da3
      - name: Fetch the golden model
        run: |
          test -f models-src/oscar/model.safetensors || cargo run --release -p sky-data -- \
            --cache "$RUNNER_TEMP/hf" fetch-model mgoeckel/oscar-1-17m \
            --rev a443c18107534cb3148941de601e15a89a2c6da3 --out models-src/oscar
      - name: Clippy
        run: cargo clippy --workspace --exclude sky-train --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --exclude sky-train --release

  # sky-train builds against MLX/Metal. Hosted macOS runners are virtual machines without Metal
  # GPU access, so the crate is compiled and linted here, and its tests are allowed to fail;
  # run them locally on Apple Silicon (see tutorial chapter 02).
  sky-train:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p sky-train --all-targets -- -D warnings
      - name: Tests (best effort without a GPU)
        continue-on-error: true
        run: cargo test -p sky-train --release

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/sky-web-wasm"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build the browser module
        run: scripts/build-wasm.sh
      - name: Parity of the served target and the iso guarantees (wasm32 under Node)
        run: RUSTFLAGS="-C target-feature=+simd128" wasm-pack test --node --release crates/sky-web --test parity --test iso
      - name: Check the output
        run: test -s site/public/pkg/sky_web_bg.wasm && test -s site/public/pkg/sky_web.js
