# s6-secrets v2 (docs/s6-secrets2-prereg.md, section 6): the pinned environment of one baseline.
# The lock next to this file is the record of what is installed; the environment itself is
# created outside the repository (UV_PROJECT_ENVIRONMENT, see scripts/secrets2/common.py).
[project]
name = "secrets2-cbx"
version = "0"
requires-python = "==3.12.*"
dependencies = ["torch==2.15.0", "transformers==5.21.0", "safetensors==0.8.0"]

[tool.uv]
package = false
# Installed inside the container only (scripts/secrets2/docker/cbx): Linux on arm64, CPU.
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]

# The CPU build of torch: the default index's Linux wheel brings the CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
