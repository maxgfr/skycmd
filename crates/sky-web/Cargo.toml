[package]
name = "sky-web"
description = "One wasm module for the browser: the skycmd game cores and the System One model, stepped together"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sky-games = { path = "../sky-games" }
sky-infer = { path = "../sky-infer", features = ["wasm"] }
sky-gguf = { path = "../sky-gguf" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.117"

[dev-dependencies]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# tests/parity.rs on wasm32 (`wasm-pack test --node crates/sky-web`).
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
