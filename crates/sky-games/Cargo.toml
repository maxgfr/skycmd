[package]
name = "sky-games"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Deterministic game cores (flappy, rescue, dodge) with state text, questions, oracles and a rollout harness"

[dependencies]
sky-schema = { path = "../sky-schema" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# No `std` feature: avoids getrandom so the crate builds for wasm32-unknown-unknown.
rand = { version = "0.8.5", default-features = false, features = ["small_rng"] }

[[bin]]
name = "sky-games-gen"
path = "src/bin/sky-games-gen.rs"
