[package]
name = "sky-train"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mlx-rs training of the skycmd-s1 and skycmd-s2 decision models: MLM pretraining, decision training, calibration and export"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sky-train"
path = "src/main.rs"

[dependencies]
mlx-rs = { version = "=0.32.0", features = ["safetensors"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
sky-gguf = { path = "../sky-gguf" }
# s6-cast: the synthetic generators, normalization, metrics and the CPU forward shared with
# inference (pure Rust, no MLX).
sky-infer = { path = "../sky-infer" }
# SPEC-S3 §7 sequence data and the closed-loop player (public DecisionGame API only).
sky-games = { path = "../sky-games" }
rand = { version = "0.8.5", default-features = false, features = ["small_rng"] }
# s5: reading PyTorch `pytorch_model.bin` checkpoints (zip archives) in `import-hf`.
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.20.0"
