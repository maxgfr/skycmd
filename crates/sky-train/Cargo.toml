[package]
name = "sky-train"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "mlx-rs training of the skycmd-s1 decision models: MLM pretraining, decision training, calibration and export"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sky-train"
path = "src/main.rs"

[dependencies]
mlx-rs = { version = "=0.32.0", features = ["safetensors"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.20.0"
