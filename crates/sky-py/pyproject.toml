[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "skycmd"
description = "Tiny System One decision models (GGUF): typed choice / score / yes-no probabilities in one forward pass"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["gguf", "decision-model", "system-one", "modernbert", "inference"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://maxgfr.github.io/skycmd/"
Documentation = "https://maxgfr.github.io/skycmd/install/"
Repository = "https://github.com/maxgfr/skycmd"

[tool.maturin]
module-name = "skycmd"
features = ["extension-module"]
