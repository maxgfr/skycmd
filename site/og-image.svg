  <rect x="0" y="0" width="1200" height="8" fill="#0ea5e9"/>
  <g transform="translate(96 150) scale(3.2)">
    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
      <line x1="14" y1="24" x2="50" y2="24"/>
      <line x1="14" y1="24" x2="14" y2="18"/>
      <line x1="50" y1="24" x2="50" y2="18"/>
