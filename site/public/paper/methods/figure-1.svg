<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715.2 475.6" width="715.2" height="475.6" role="img" aria-labelledby="paper-m-fig1-title paper-m-fig1-desc" fill="currentColor" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" style="display:block;width:100%;max-width:720px;height:auto;margin:0 auto">
<title id="paper-m-fig1-title">The skycmd-s2 decision graph: two streams, a cache, a looped state block with an exit after each pass, and a shared fusion head</title>
<desc id="paper-m-fig1-desc">The question and its options are encoded once by the static encoder, in which each option sees the question and itself only, and cached as option markers and question tokens. Every frame, the state is embedded with one token per key and value and passed through B shared blocks, up to L times. After each pass an exit normalises the hidden states; the fusion head, shared by all exits, lets each option marker attend to those states and the cached question tokens, never to the other markers; the scorer gives one logit per option, divided by a temperature per exit, type and bucket. If the top probability reaches the threshold of the question's type, or the exit is the last, the answer is returned; otherwise the next pass runs.</desc>
<defs><marker id="paper-m-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="currentColor"/></marker></defs>
<g><rect x="7.2" y="24" width="206.4" height="72" rx="5" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="110.4" y="50" text-anchor="middle" font-weight="650">Question and options</text>
<text x="110.4" y="64.5" text-anchor="middle" font-size="10.5" fill-opacity=".85">[CLS] {t} question: {ins} [SEP]</text>
<text x="110.4" y="79" text-anchor="middle" font-size="10.5" fill-opacity=".85">[MASK] opt₁ … [MASK] optₙ</text>
</g>
<g><rect x="254.4" y="24" width="206.4" height="72" rx="5" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="357.6" y="50" text-anchor="middle" font-weight="650">Static encoder</text>
<text x="357.6" y="64.5" text-anchor="middle" font-size="10.5" fill-opacity=".85">Q sees Q; each Oᵢ sees Q and Oᵢ</text>
<text x="357.6" y="79" text-anchor="middle" font-size="10.5" fill-opacity=".85">every Oᵢ starts at position |Q|</text>
</g>
<g><rect x="501.6" y="24" width="206.4" height="72" rx="5" fill="currentColor" fill-opacity=".08" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="604.8" y="50" text-anchor="middle" font-weight="650">Cache, once per question</text>
<text x="604.8" y="64.5" text-anchor="middle" font-size="10.5" fill-opacity=".85">markers mᵢ + type embedding</text>
<text x="604.8" y="79" text-anchor="middle" font-size="10.5" fill-opacity=".85">question tokens as keys, values</text>
</g>
<g><rect x="7.2" y="134.4" width="206.4" height="72" rx="5" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="110.4" y="160.4" text-anchor="middle" font-weight="650">State, every frame</text>
<text x="110.4" y="174.9" text-anchor="middle" font-size="10.5" fill-opacity=".85">[CLS] vy -3 dx 35 … [SEP]</text>
<text x="110.4" y="189.4" text-anchor="middle" font-size="10.5" fill-opacity=".85">one token per key and value</text>
</g>
<g><rect x="254.4" y="134.4" width="206.4" height="72" rx="5" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="357.6" y="160.4" text-anchor="middle" font-weight="650">Shared state blocks</text>
<text x="357.6" y="174.9" text-anchor="middle" font-size="10.5" fill-opacity=".85">B blocks, applied up to L times</text>
<text x="357.6" y="189.4" text-anchor="middle" font-size="10.5" fill-opacity=".85">pass l adds loop_embd[l]</text>
</g>
<g><rect x="254.4" y="244.8" width="206.4" height="72" rx="5" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="357.6" y="270.8" text-anchor="middle" font-weight="650">Exit after each pass</text>
<text x="357.6" y="285.3" text-anchor="middle" font-size="10.5" fill-opacity=".85">Hₑ = LNₑ(hidden states)</text>
<text x="357.6" y="299.8" text-anchor="middle" font-size="10.5" fill-opacity=".85">exit e counts the block passes</text>
</g>
<g><rect x="501.6" y="244.8" width="206.4" height="72" rx="5" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="604.8" y="270.8" text-anchor="middle" font-weight="650">Fusion head, shared by exits</text>
<text x="604.8" y="285.3" text-anchor="middle" font-size="10.5" fill-opacity=".85">markers attend to [Hₑ; question]</text>
<text x="604.8" y="299.8" text-anchor="middle" font-size="10.5" fill-opacity=".85">never to each other</text>
</g>
<g><rect x="501.6" y="355.2" width="206.4" height="72" rx="5" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="604.8" y="381.2" text-anchor="middle" font-weight="650">Scorer and temperature</text>
<text x="604.8" y="395.7" text-anchor="middle" font-size="10.5" fill-opacity=".85">one logit sᵢ per option</text>
<text x="604.8" y="410.2" text-anchor="middle" font-size="10.5" fill-opacity=".85">p = softmax(s / T[e, t, bucket])</text>
</g>
<g><rect x="254.4" y="355.2" width="206.4" height="72" rx="5" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="357.6" y="388.5" text-anchor="middle" font-weight="650">Exit test</text>
<text x="357.6" y="403" text-anchor="middle" font-size="10.5" fill-opacity=".85">max p ≥ τₜ, or last exit?</text>
</g>
<g><rect x="7.2" y="355.2" width="206.4" height="72" rx="5" fill="none" stroke="currentColor" stroke-opacity=".7" stroke-width="1.2"/>
<text x="110.4" y="381.2" text-anchor="middle" font-weight="650">Answer</text>
<text x="110.4" y="395.7" text-anchor="middle" font-size="10.5" fill-opacity=".85">p over the options,</text>
<text x="110.4" y="410.2" text-anchor="middle" font-size="10.5" fill-opacity=".85">the exit and the passes used</text>
</g>
<path d="M213.6,60L254.4,60" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<path d="M460.8,60L501.6,60" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<path d="M604.8,96L604.8,244.8" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<text x="610.6" y="174.4" text-anchor="start" font-size="10.5" font-style="italic">cached</text>
<path d="M213.6,170.4L254.4,170.4" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<path d="M357.6,206.4L357.6,244.8" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<text x="363.4" y="229.6" text-anchor="start" font-size="10.5" font-style="italic">pass l</text>
<path d="M460.8,280.8L501.6,280.8" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<text x="481.2" y="269.2" text-anchor="middle" font-size="10.5" font-style="italic">Hₑ</text>
<path d="M604.8,316.8L604.8,355.2" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<path d="M501.6,391.2L460.8,391.2" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<path d="M254.4,405.6L213.6,405.6" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<text x="234" y="426.2" text-anchor="middle" font-size="10.5" font-style="italic">yes</text>
<path d="M254.4,376.8L234,376.8L234,192L254.4,192" fill="none" stroke="currentColor" stroke-width="1.4" marker-end="url(#paper-m-arrow)"/>
<text x="228.2" y="284.8" text-anchor="end" font-size="10.5" font-style="italic">no: next pass</text>
<text x="0" y="453.6" font-size="11.5" fill-opacity=".8">Shaded: computed once per question and cached. White: every frame.</text>
<text x="0" y="469.6" font-size="11.5" fill-opacity=".8">Linear layers ternary, w ∈ {−1, 0, +1}·γ (2 bits each); embeddings int8; norms f32.</text>
</svg>
