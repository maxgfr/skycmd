<title id="paper-m-fig2-title">The router size map: accuracy against bytes, with tool names shown and masked</title>
<desc id="paper-m-fig2-desc">Accuracy on 945 fresh requests against the bytes each router downloads, on a logarithmic axis from 1 MB to 100 MB, with BM25 at a separate 0-byte position. 1. BM25 (0 bytes): 0.8169; names masked 0.8138. 2. embedding part, potion-base-2M at 4 bits (1,273,312 bytes): 0.7386; names masked 0.7280. 3. model part, s6-route-nano (2,418,912 bytes): 0.7926; names masked 0.0720. 4. s6-route, the two parts multiplied (3,692,224 bytes): 0.8868; names masked 0.2497. 5. all-MiniLM-L6-v2 (91.6 MB): 0.9048; names masked 0.9005.</desc>
