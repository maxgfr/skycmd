<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 502" width="480" height="502" role="img" aria-labelledby="paper-fig1-title paper-fig1-desc" fill="currentColor" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" style="display:block;width:100%;max-width:520px;height:auto;margin:0 auto">
<title id="paper-fig1-title">Readings of the same file on its own distribution and on other data</title>
<desc id="paper-fig1-desc">Dot plot, one row per line, on an axis from 0.4 to 1. s6-route7-nano, accuracy: validation 0.8802; fresh tools of a new family 0.5610; BM25 on the other data 0.5675. s6-route, accuracy: held-out tools 0.8868; a new tool family (reported) 0.5530; BM25 on the other data 0.5675. s6-ear2-nano, AUC: Smart Turn's test clips 0.9600; eot-bench, real speech 0.7299; Smart Turn on the other data 0.7838. s6-secrets-verify-pico, line F1: validation repositories 0.8603; test repositories 0.8561; best rule scanner on the other data 0.7332. On other data the reading falls far below the line's own for the two routers and the end-of-turn detector, and stays level with it for the secrets verifier.</desc>
<g font-size="13">
<circle cx="8" cy="12" r="5.5" fill="none" stroke="#0284c7" stroke-width="3"/><text x="20" y="17">its own distribution</text>
<path class="paper-fig1-b" fill="#c2410c" d="M171,5L178,12L171,19L164,12Z"/><text x="184" y="17">other data</text>
<path d="M271,4V20" stroke="currentColor" stroke-width="2"/><text x="279" y="17">reference, on the other data</text>
</g>
<text x="0" y="44" font-size="12" fill-opacity=".75">Each row has its own metric; higher is better on all four. The axis starts at 0.4.</text>
<g>
<text x="0" y="86" font-weight="650">s6-route7-nano<tspan font-weight="400" fill-opacity=".75"> · accuracy</tspan></text>
<text x="0" y="104" font-size="12" fill-opacity=".8">validation 0.8802 → fresh tools of a new family 0.5610</text>
<text x="0" y="119" font-size="12" fill-opacity=".8">BM25 on the other data: 0.5675</text>
