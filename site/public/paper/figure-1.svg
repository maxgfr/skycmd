<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 618" width="640" height="618" role="img" aria-labelledby="paper-gates-title paper-gates-desc" fill="currentColor" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" style="display:block;width:100%;max-width:680px;height:auto;margin:0 auto">
<title id="paper-gates-title">Every gate, as read: one condition of each gated file against its bar</title>
<desc id="paper-gates-desc">Gate dashboard: one row per gated file, with one condition of its gate. Each row has its own scale centred on the bar, and right is better. s6-nano: typed_decisions_bench: 0.480, bar &gt; 0.398; passed. s6-micro v2: typed_decisions_bench: 0.553, bar ≥ 0.45; passed, a second look. s6-micro-v1: ECE: 0.0821 [0.0746, 0.0900], bar ≤ 0.08; failed. s4-micro: typed_decisions_bench: 0.343, bar &gt; 0.55; failed. s6-secrets-pico: secret exposed, secret_bench: 0.9990, bar &gt; 0.977; passed. s6-secrets-verify-pico: line F1 over the best rule scanner: +0.1229 [+0.0413, +0.3613], bar ≥ +0.15; failed. s6-ear-nano: end of turn: 0.5681, bar ≥ 0.9263; failed. s6-ear2-nano: accuracy, Smart Turn's test: 0.8993 [0.8962, 0.9027], bar ≥ 0.85; passed. s6-ear3-nano: AUC change on eot-bench (E1): −0.0252 [−0.0336, −0.0167], bar ≥ +0.02; failed. s6-cast-pico: GIFT-Eval nGMASE: 0.9471, bar ≤ 0.838; failed. s6-cast2-pico: GIFT-Eval nGMASE (G1): 0.8847, bar ≤ 0.838; failed. s6-route-nano: accuracy minus BM25 (G1): −0.0105 [−0.0265, +0.0055], bar &gt; 0; failed. s6-route: accuracy minus BM25: +0.0698 [+0.0455, +0.0952], bar lower bound &gt; 0; passed, a second look. s6-route7-nano: accuracy minus BM25 on T5 (G1): −0.0065 [−0.0235, +0.0120], bar lower bound &gt; 0; failed. s6-sleep3-nano: sleep gain on recall (H1): +0.0030 [−0.0010, +0.0068], bar lower bound &gt; 0; failed.</desc>
